[package]
name = "everystate"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/mattzcarey/everystate"
description = "A TLA+ model checker (TLC-compatible)"
license = "MIT"

[lib]
name = "everystate"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "everystate"
path = "src/main.rs"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mimalloc = { version = "0.1.52", default-features = false, features = ["v2"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

[profile.profiling]
inherits = "release"
debug = true
lto = "thin"
